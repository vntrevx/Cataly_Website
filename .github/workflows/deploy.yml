name: Deploy Cataly to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cataly-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cataly-pages-production
      url: https://cataly.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the static site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: bun run build

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CATALY_PAGES_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CATALY_PAGES_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: >-
          bun run wrangler pages deploy dist
          --project-name=cataly-website
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-dirty=false
